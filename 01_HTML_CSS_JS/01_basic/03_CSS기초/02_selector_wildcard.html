<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <style>
    * {
      color: red;
    }
    /* 태그 선택자 */
    h1 {
      color: blue;
    }
    /* 
    클래스 선택자 
    - 여러 클래스를 한번에 적용할 수 있다.
    */
    .select {
      color: black;
    }
    /* 아이디 선택자 */
    #banana {
      color: aqua;
    }
    #bana {
      background-color: olive;
    }

    .item {
      background-color: blueviolet;
    }
  </style>

  <body>
    <!-- 
    전체 선택자(*)
    -->
    <h1>제목 글자</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellat rerum
      cupiditate laboriosam neque ducimus perspiciatis, nobis error ab obcaecati
      corrupti non eos quasi doloribus eum, beatae unde delectus ex amet.
    </p>

    <ul>
      <li>사과</li>
      <li class="select item" id="banana">바나나</li>
      <li>오렌지</li>
      <li class="select">감</li>
    </ul>
  </body>
</html>
