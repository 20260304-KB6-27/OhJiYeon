<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 500px;
        margin: 10px auto;
      }
      #top {
        background-color: green;
      }
      #bottom {
        background-color: purple;
      }
      #left {
        width: 200px;
        background-color: red;
      }
      #right {
        width: 200px;
        background-color: blue;
      }
      #middle {
        display: flex;
        /* 
        flex : 요소들을 정렬하기 위한 레이아웃 방식

        특징
        - 부모 요소에 display: flex 속성으로 flex 컨테이너 지정
        - 자식 요소들을 원하는 형태로 정렬하는데 사용됨.
        
        */

        /* 요소 가로 세로 배열 시키기 */
        flex-direction: row;

        /* 배치 정렬 및 여백*/
        justify-content: space-around;
        /* 
        center: 가운데 정렬
        flex-end: 오른쪽 정렬
        space-around: 요소기준 여백 동일하게
        space-evenly: 여백 기준 동일하게
         */
      }
      .container {
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="top">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Voluptatem,
        cupiditate! ...
      </div>
      <div id="middle">
        <div id="left">
          Lorem ipsum dolor sit amet consectetur, adipisicing elit. dolore
          architecto.
        </div>
        <div id="right">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. ...
        </div>
      </div>
      <div id="bottom">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. ...
      </div>
    </div>
  </body>
</html>
