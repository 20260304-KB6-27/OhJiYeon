<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .box {
      width: 100px;
      height: 100px;
      position: absolute;
    }
    .box:nth-child(1) {
      background-color: red;
      left: 10px;
      top: 10px;
    }
    .box:nth-child(2) {
      background-color: green;
      left: 50px;
      top: 50px;
    }
    .box:nth-child(3) {
      background-color: blue;
      left: 100px;
      top: 100px;
    }
    .outline {
      border: 5px solid black;
      width: 300px;
      height: 150px;
      position: relative;
      overflow: hidden;
    }
  </style>
  <body>
    <h1>Lorem ipsum dolor sit.</h1>
    <div class="outline">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
    <h1>Lorem ipsum dolor sit.</h1>
  </body>
</html>
